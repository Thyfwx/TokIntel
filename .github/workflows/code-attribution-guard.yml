name: Code attribution guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check added source and commit metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git diff --unified=0 --no-ext-diff --no-color "$BASE_SHA" "$HEAD_SHA" > /tmp/code-attribution.patch
          git log --format='%H%x00%an%x00%ae%x00%cn%x00%ce%x00%B%x00%x00' "$BASE_SHA..$HEAD_SHA" > /tmp/code-attribution.commits
          python3 scripts/check_code_attribution.py
